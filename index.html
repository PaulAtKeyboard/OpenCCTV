<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Auckland CCTV Network</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ff4d4d' stroke='%23b30000' stroke-width='8'/></svg>">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css"
      integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ=="
      crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"
      integrity="sha512-GffPMF3RvMeYyc1LWMHtK8EbPv0iNZ8/oTtHPx9/cc2ILxQ+u905qIwdpULaqDkyBKgOaB57QTMg7ztg8Jm2Og=="
      crossorigin=""></script>

    <!-- Local dataset (avoids a network fetch and works when opened directly from disk) -->
    <script src="data.js"></script>

    <style>
      html, body, #map { height: 100%; margin: 0; padding: 0; }
      .camera-count {
        position: absolute; z-index: 1000; top: 10px; right: 10px;
        background: rgba(34, 34, 34, 0.85); color: #efefef;
        font-family: sans-serif; font-size: 13px;
        padding: 6px 10px; border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <div class="camera-count" id="camera-count"></div>

    <script>
      var map = L.map('map').setView([-36.8513, 174.7644], 11);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      var camerasLayer = L.geoJSON(data, {
        pointToLayer: function (feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 5,
            weight: 1,
            color: '#b30000',
            fillColor: '#ff4d4d',
            fillOpacity: 0.8
          });
        },
        onEachFeature: function (feature, layer) {
          var props = feature.properties || {};
          layer.bindPopup(
            '<b>' + (props['Business Unit'] || 'Unknown') + '</b><br>' +
            (props['Location'] || '')
          );
        }
      }).addTo(map);

      document.getElementById('camera-count').textContent =
        data.features.length + ' camera locations';
    </script>
  </body>
</html>
